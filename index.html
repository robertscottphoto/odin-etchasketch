<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Etch A Sketch - odinProject - Robert Valentine</title>
</head>
<body>
    <div class="container">
        <div class="options">
            <label for="input-field">ENTER NUMBER OF CELLS PER SIDE</label>
            <input type="number" placeholder="Enter number of squaresper side" id="input-field" class="input" min="1" max="100" title="Enter number of square cells per side"">
            <div class="divider"></div>
            <label for="color-choice">BRUSH COLOR</label>
            <input type="color" value="#000000" id="color-choice">
            <div class="divider"></div>
            <button id="erase">ERASE ALL PAINT</button>
        </div>
        
        <div class="content">
            <div id="canvas-container">
            </div>
        </div>
        
    <script src="script.js"></script>
</body>
</html>
