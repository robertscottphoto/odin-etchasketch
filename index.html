<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Etch A Sketch - odinProject - Robert Valentine</title>
</head>
<body>
    <div class="title">
        <h1>Etch-A-Sketch</h1>
        <p>Move your cursor to paint. Click & Drag to erase.</p>
    </div>
    <div class="container">
        <div class="options">
            <div class="squaresPerSide">
                <label for="input-field">Squares Per Side</label>
                <input type="number" placeholder="0" id="input-field" class="input" min="1" max="100" title="Enter number of square cells per side">
            </div>
            <div class="color">
                <label for="color-choice">Color</label>
                <input type="color" value="#000000" id="color-choice">
            </div>
            <div class="erase">
                <button id="erase">Erase All</button>
            </div>
        </div>
        
        <div class="content">
            <div id="canvas-container">
            </div>
        </div>
        
    <script src="script.js"></script>
</body>
</html>
