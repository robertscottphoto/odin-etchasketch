<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Etch A Sketch - odinProject - Robert Valentine</title>
</head>
<body>
    <div class="container">
        <div class="options">
            <label for="input-field">Enter number of cells</label>
            <input type="number" placeholder="Enter number of squaresper side" id="input-field" class="input" min="1" max="100">
            <label for="color-choice">Pick Pen Color</label>
            <input type="color" value="#000000" id="color-choice">
            <label for="clear">Clear All Fills</label>
            <button id="erase">Erase Paint</button>
        </div>
        
        <div class="content">
            <div id="canvas-container">
            </div>
        </div>
        
    <script src="script.js"></script>
</body>
</html>
